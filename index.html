<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>摄影师共享 SKU 查看页</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; color: #1f2937; background: #f4f6f8; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #dde3ea; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 20px; }
    .version { color: #667085; font-size: 12px; margin-top: 6px; }
    .updated { color: #667085; font-size: 13px; white-space: nowrap; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 24px; background: #fff; border-bottom: 1px solid #dde3ea; align-items: center; }
    label { font-size: 13px; color: #4b5563; }
    .hint { color: #8a94a6; font-size: 12px; margin-left: 4px; }
    select, input { height: 34px; padding: 0 10px; border: 1px solid #c8d0da; border-radius: 6px; min-width: 160px; background: #fff; }
    input { min-width: 220px; }
    button { height: 34px; border: 1px solid #c8d0da; border-radius: 6px; padding: 0 12px; background: #fff; cursor: pointer; font-family: inherit; }
    .copy-current { background: #2563eb; border-color: #2563eb; color: #fff; }
    main { padding: 18px 24px; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat { background: #fff; border: 1px solid #dde3ea; border-radius: 8px; padding: 12px 14px; }
    .stat span { display: block; color: #667085; font-size: 12px; margin-bottom: 5px; }
    .stat strong { font-size: 22px; }
    .card { background: #fff; border: 1px solid #dde3ea; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    .meta { color: #667085; font-size: 13px; margin-bottom: 8px; }
    .warn { color: #b42318; font-size: 13px; margin-bottom: 8px; }
    .name { font-size: 17px; font-weight: 700; }
    .skus { display: flex; flex-wrap: wrap; gap: 6px; }
    .sample-groups { display: grid; gap: 10px; }
    .sample-group { border: 1px solid #e3e8f0; border-radius: 8px; padding: 10px 12px; background: #fafbfc; }
    .sample-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
    .sample-title { font-size: 13px; font-weight: 700; color: #344054; }
    .sample-count { font-size: 12px; color: #667085; }
    .sku { font-family: Consolas, monospace; background: #eef2ff; color: #26377a; border-radius: 4px; padding: 4px 7px; }
    .hit { background: #ffe58f; color: #111827; }
    .empty-inline { color: #8a94a6; background: #f3f5f8; border-radius: 4px; padding: 4px 7px; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; }
    .empty { color: #667085; padding: 24px; background: #fff; border: 1px solid #dde3ea; border-radius: 8px; }
    .toast { position: fixed; right: 18px; bottom: 18px; background: #111827; color: #fff; padding: 10px 12px; border-radius: 6px; opacity: 0; transform: translateY(8px); transition: all .18s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .copy-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .42); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 20; }
    .copy-modal.show { display: flex; }
    .copy-box { width: min(620px, 100%); background: #fff; border-radius: 8px; border: 1px solid #dde3ea; padding: 16px; box-shadow: 0 18px 50px rgba(15, 23, 42, .22); }
    .copy-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; font-weight: 700; }
    .copy-box textarea { width: 100%; min-height: 220px; border: 1px solid #c8d0da; border-radius: 6px; padding: 10px; resize: vertical; font-family: Consolas, "Microsoft YaHei", monospace; line-height: 1.5; }
    .copy-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .hidden { display: none; }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      .stats { grid-template-columns: 1fr; }
      select, input { width: 100%; min-width: 0; }
      .controls label { width: 100%; }
      .card-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>摄影师共享 SKU 查看页</h1>
      <div class="version">版本：2026-08-21-读取全部数据版</div>
    </div>
    <div class="updated">最后更新时间：<span id="updatedAt">--</span></div>
  </header>
  <section class="controls">
    <label>年份</label>
    <select id="year"></select>
    <label>月份</label>
    <select id="month"></select>
    <label>日期</label>
    <select id="date"></select>
    <label>摄影师 <span class="hint">按字母 A 到 Z 排序</span></label>
    <select id="name"><option value="">全部摄影师</option></select>
    <label>SKU</label>
    <input id="sku" placeholder="筛选 SKU，支持部分编码">
    <button type="button" class="copy-current" id="copyCurrentSkuBtn">复制当前摄影师当日全部 SKU</button>
  </section>
  <main>
    <section class="stats">
      <div class="stat"><span>显示摄影师</span><strong id="statPeople">0</strong></div>
      <div class="stat"><span>历史日期</span><strong id="statDates">0</strong></div>
      <div class="stat"><span>总记录</span><strong id="statRows">0</strong></div>
    </section>
    <section id="result"></section>
  </main>
  <div class="toast" id="toast">已复制</div>
  <div class="copy-modal" id="copyModal">
    <div class="copy-box">
      <div class="copy-head">
        <span>手动复制</span>
        <button type="button" id="closeCopyModalBtn">关闭</button>
      </div>
      <textarea id="copyFallbackText" readonly></textarea>
      <div class="copy-actions">
        <button type="button" id="selectCopyTextBtn">全选内容</button>
        <button type="button" id="doneCopyModalBtn">完成</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      url: "https://plrqzyojekqouyljfihe.supabase.co",
      anonKey: "sb_publishable_NZVl4VRf6nozXwHOyWmfUg_No564-Xi",
      table: "sku_records",
      viewLogTable: "view_logs",
      realtimeSchema: "public"
    };

    const supabaseClient = window.supabase.createClient(CONFIG.url, CONFIG.anonKey);

    const state = {
      rows: [],
      updatedAt: "",
      loading: false
    };

    const yearSelect = document.getElementById("year");
    const monthSelect = document.getElementById("month");
    const dateSelect = document.getElementById("date");
    const nameSelect = document.getElementById("name");
    const skuInput = document.getElementById("sku");
    const result = document.getElementById("result");
    const updatedAt = document.getElementById("updatedAt");
    const statPeople = document.getElementById("statPeople");
    const statDates = document.getElementById("statDates");
    const statRows = document.getElementById("statRows");
    const toast = document.getElementById("toast");
    const copyModal = document.getElementById("copyModal");
    const copyFallbackText = document.getElementById("copyFallbackText");
    const closeCopyModalBtn = document.getElementById("closeCopyModalBtn");
    const selectCopyTextBtn = document.getElementById("selectCopyTextBtn");
    const doneCopyModalBtn = document.getElementById("doneCopyModalBtn");
    const copyCurrentSkuBtn = document.getElementById("copyCurrentSkuBtn");
    const nameCollator = new Intl.Collator("zh-Hans-u-co-pinyin", { sensitivity: "base", numeric: true });
    let copyStore = {};
    const photographerRoster = [
      "祝宜舜",
      "陈灿",
      "陈云",
      "樊汉书",
      "秦宾宾",
      "瞿璋翔",
      "涂志豪",
      "汪琪",
      "王红星",
      "王雨婷",
      "周可可",
      "邹伟",
      "黄福",
      "甘引健"
    ].sort(nameCollator.compare);
    const hiddenPhotographers = new Set(["付显锋"]);
    const hiddenDates = new Set(["8.8日", "8.8", "2026-8.8日", "2026-08-08"]);
    const viewLogCache = new Set();

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      }[c]));
    }

    function normalizePhotographer(value) {
      return String(value ?? "")
        .normalize("NFKC")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .replace(/\u00a0/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function photographerKey(value) {
      return normalizePhotographer(value).replace(/\s+/g, "").toLowerCase();
    }

    function samePhotographer(a, b) {
      return photographerKey(a) === photographerKey(b);
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1400);
    }

    function openCopyModal(text) {
      copyFallbackText.value = text;
      copyModal.classList.add("show");
      setTimeout(() => {
        copyFallbackText.focus();
        copyFallbackText.select();
      }, 30);
      showToast("请手动复制");
    }

    function closeCopyModal() {
      copyModal.classList.remove("show");
    }

    function selectFallbackText() {
      copyFallbackText.focus();
      copyFallbackText.select();
    }

    async function copyText(text) {
      const content = String(text || "");
      if (!content) {
        showToast("没有可复制内容");
        return;
      }
      openCopyModal(content);
      try {
        if (!navigator.clipboard || !window.isSecureContext) throw new Error("clipboard unavailable");
        await navigator.clipboard.writeText(content);
        showToast("已复制");
      } catch (_err) {
        try {
          const area = document.createElement("textarea");
          area.value = content;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.left = "-9999px";
          document.body.appendChild(area);
          area.focus();
          area.select();
          const ok = document.execCommand("copy");
          area.remove();
          if (!ok) throw new Error("execCommand failed");
          showToast("已复制");
        } catch (_fallbackErr) {
          showToast("请按 Ctrl+C 复制");
        }
      }
    }

    async function recordView(reason = "open") {
      const selectedName = nameSelect.value.trim();
      const selectedDate = dateSelect.value.trim();
      const visitorName = selectedName || "未选择摄影师";
      const cacheKey = `${visitorName}|${selectedDate}|${reason}`;
      if (viewLogCache.has(cacheKey)) return;
      viewLogCache.add(cacheKey);
      try {
        await supabaseClient.from(CONFIG.viewLogTable).insert({
          visitor_name: visitorName,
          viewed_date: selectedDate || null,
          page_url: window.location.href.split("#")[0],
          user_agent: navigator.userAgent || "",
          reason
        });
      } catch (_err) {
        // 访问记录失败不影响摄影师正常查看。
      }
    }

    function parseDateParts(value) {
      const text = String(value ?? "").trim();
      if (!text) return null;
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return {
          year: value.getFullYear(),
          month: value.getMonth() + 1,
          day: value.getDate()
        };
      }
      if (/^\d{5}$/.test(text)) {
        const utcDays = Math.floor(Number(text) - 25569);
        const date = new Date(utcDays * 86400 * 1000);
        if (!Number.isNaN(date.getTime())) {
          return {
            year: date.getUTCFullYear(),
            month: date.getUTCMonth() + 1,
            day: date.getUTCDate()
          };
        }
      }
      let match = text.match(/(20\d{2}|19\d{2})\D*(\d{1,2})\D*(\d{1,2})/);
      if (match) {
        return {
          year: Number(match[1]),
          month: Number(match[2]),
          day: Number(match[3])
        };
      }
      match = text.match(/^(\d{1,2})\D*(\d{1,2})/);
      if (match) {
        return {
          year: new Date().getFullYear(),
          month: Number(match[1]),
          day: Number(match[2])
        };
      }
      return null;
    }

    function canonicalDate(value) {
      const parts = parseDateParts(value);
      if (!parts) return String(value ?? "").trim();
      return `${parts.year}-${String(parts.month).padStart(2, "0")}-${String(parts.day).padStart(2, "0")}`;
    }

    function sameDate(a, b) {
      const left = canonicalDate(a);
      const right = canonicalDate(b);
      return left && right && left === right;
    }

    function isHiddenDate(value) {
      const text = String(value || "").trim();
      const normalized = canonicalDate(text);
      return hiddenDates.has(text) || hiddenDates.has(normalized);
    }

    function yearOfDate(date) {
      const parts = parseDateParts(date);
      return parts ? String(parts.year) : "";
    }

    function monthOfDate(date) {
      const parts = parseDateParts(date);
      return parts ? String(parts.month).padStart(2, "0") : "";
    }

    function monthLabel(month) {
      return month ? `${Number(month)}月` : "";
    }

    function dateSortKey(d) {
      const parts = String(d || "").match(/\d+/g) || [];
      const year = parseInt(yearOfDate(d), 10) || 0;
      if (parts.length >= 3) return [parseInt(parts[0], 10) || 0, parseInt(parts[1], 10) || 0, parseInt(parts[2], 10) || 0, String(d)];
      if (parts.length === 2) return [year, parseInt(parts[0], 10) || 0, parseInt(parts[1], 10) || 0, String(d)];
      if (parts.length === 1) return [year, parseInt(parts[0], 10) || 0, 0, String(d)];
      return [9999, 99, 99, String(d)];
    }

    function allDates() {
      return [...new Set(state.rows.map(r => canonicalDate(r.shoot_date)).filter(d => d && !isHiddenDate(d)))].sort((a, b) => {
        const ka = dateSortKey(a), kb = dateSortKey(b);
        for (let i = 0; i < 4; i++) if (ka[i] !== kb[i]) return ka[i] > kb[i] ? 1 : -1;
        return 0;
      });
    }

    function years() {
      return [...new Set(allDates().map(yearOfDate).filter(Boolean))].sort((a, b) => Number(a) - Number(b));
    }

    function monthsForYear(year) {
      return [...new Set(allDates()
        .filter(d => !year || yearOfDate(d) === year)
        .map(monthOfDate)
        .filter(Boolean))]
        .sort((a, b) => Number(a) - Number(b));
    }

    function datesForYearMonth(year, month) {
      return allDates().filter(d => {
        if (year && yearOfDate(d) !== year) return false;
        if (month && monthOfDate(d) !== month) return false;
        return true;
      });
    }

    function namesForDate(date) {
      const targetDate = canonicalDate(date);
      const names = state.rows
        .filter(r => !hiddenPhotographers.has(normalizePhotographer(r.photographer)))
        .filter(r => !isHiddenDate(r.shoot_date))
        .filter(r => !targetDate || sameDate(r.shoot_date, targetDate))
        .map(r => normalizePhotographer(r.photographer))
        .filter(Boolean);
      const detected = [...new Set(names)].sort(nameCollator.compare);
      const merged = [...new Set([...photographerRoster, ...detected])];
      return merged.sort(nameCollator.compare);
    }

    function filteredRows() {
      const y = yearSelect.value;
      const m = monthSelect.value;
      const d = dateSelect.value;
      const selectedName = nameSelect.value;
      const keyword = skuInput.value.trim().toLowerCase();
      return state.rows.filter(row => {
        const photographer = normalizePhotographer(row.photographer);
        if (hiddenPhotographers.has(photographer)) return false;
        if (isHiddenDate(row.shoot_date)) return false;
        if (y && yearOfDate(row.shoot_date) !== y) return false;
        if (m && monthOfDate(row.shoot_date) !== m) return false;
        if (d && !sameDate(row.shoot_date, d)) return false;
        if (selectedName && !samePhotographer(photographer, selectedName)) return false;
        if (keyword && !String(row.sku || "").toLowerCase().includes(keyword)) return false;
        return true;
      });
    }

    function skuPrefix(value) {
      const text = String(value || "").trim();
      if (!text) return "未填写";
      const match = text.match(/^[A-Za-z]+/);
      if (match) return match[0].toUpperCase();
      return "其他";
    }

    function buildSkuGroups(items) {
      const map = new Map();
      for (const item of items) {
        const sku = String(item.sku || "").trim();
        const prefix = skuPrefix(sku);
        if (!map.has(prefix)) map.set(prefix, []);
        map.get(prefix).push(sku);
      }
      return [...map.entries()]
        .map(([prefix, skus]) => ({ prefix, skus: skus.filter(Boolean) }))
        .sort((a, b) => nameCollator.compare(a.prefix, b.prefix));
    }

    function buildCompleteMessage(group, skuGroups) {
      const lines = [
        `${group.shoot_date} 拍摄产品信息`,
        `摄影师：${group.photographer}`,
        `产品信息/sku：`
      ];
      for (const sub of skuGroups) {
        lines.push(`【${sub.prefix} 样品组】${sub.skus.join("，")}`);
      }
      lines.push(`总数/件：${skuGroups.reduce((sum, sub) => sum + sub.skus.length, 0)}`);
      return lines.join("\n");
    }

    function currentSkuText() {
      const rows = filteredRows();
      const selectedName = nameSelect.value.trim();
      const selectedDate = canonicalDate(dateSelect.value.trim());
      if (!selectedName) return "";
      const skus = rows
        .filter(row => samePhotographer(row.photographer, selectedName))
        .filter(row => !selectedDate || sameDate(row.shoot_date, selectedDate))
        .map(row => String(row.sku || "").trim())
        .filter(Boolean);
      return skus.join("\n");
    }

    function updateCopyCurrentButton() {
      const selectedName = nameSelect.value.trim();
      const count = currentSkuText().split("\n").filter(Boolean).length;
      copyCurrentSkuBtn.disabled = !selectedName || count === 0;
      copyCurrentSkuBtn.textContent = selectedName && count
        ? `复制${selectedName}当日全部 SKU（${count}）`
        : "复制当前摄影师当日全部 SKU";
    }

    function refreshYears() {
      const keep = yearSelect.value;
      const list = years();
      yearSelect.innerHTML = '<option value="">全部年份</option>' + list.map(y => `<option value="${esc(y)}">${esc(y)}</option>`).join("");
      if (list.includes(keep)) yearSelect.value = keep;
      else if (list.length) yearSelect.value = list[list.length - 1];
    }

    function refreshMonthsForYear() {
      const keep = monthSelect.value;
      const list = monthsForYear(yearSelect.value);
      monthSelect.innerHTML = '<option value="">全部月份</option>' + list.map(m => `<option value="${esc(m)}">${esc(monthLabel(m))}</option>`).join("");
      if (list.includes(keep)) monthSelect.value = keep;
      else if (list.length) monthSelect.value = list[list.length - 1];
    }

    function refreshDatesForYear() {
      const keep = dateSelect.value;
      const year = yearSelect.value;
      const month = monthSelect.value;
      const list = datesForYearMonth(year, month);
      dateSelect.innerHTML = '<option value="">全部日期</option>' + list.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("");
      if (list.includes(keep)) dateSelect.value = keep;
      else if (list.length) dateSelect.value = list[list.length - 1];
    }

    function syncDefaultDatePath() {
      if (!yearSelect.value) {
        const yearsList = years();
        if (yearsList.length) yearSelect.value = yearsList[yearsList.length - 1];
      }
      refreshMonthsForYear();
      if (!monthSelect.value) {
        const monthsList = monthsForYear(yearSelect.value);
        if (monthsList.length) monthSelect.value = monthsList[monthsList.length - 1];
      }
      refreshDatesForYear();
      if (!dateSelect.value) {
        const datesList = datesForYearMonth(yearSelect.value, monthSelect.value);
        if (datesList.length) dateSelect.value = datesList[datesList.length - 1];
      }
    }

    function refreshNames() {
      const keep = nameSelect.value;
      const date = dateSelect.value;
      const list = namesForDate(date);
      nameSelect.innerHTML = '<option value="">全部摄影师</option>' + list.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
      if (list.includes(keep)) nameSelect.value = keep;
    }

    function render() {
      const rows = filteredRows();
      const selectedName = nameSelect.value.trim();
      const displayNames = selectedName ? [selectedName] : namesForDate(dateSelect.value);
      copyStore = {};
      let copyIndex = 0;
      statRows.textContent = rows.length;
      statDates.textContent = allDates().length;
      statPeople.textContent = displayNames.length;
      updatedAt.textContent = state.updatedAt || "--";
      updateCopyCurrentButton();

      const grouped = [];
      const map = new Map();
      for (const row of rows) {
        const key = `${row.shoot_date}||${row.photographer}`;
        if (!map.has(key)) {
          map.set(key, { shoot_date: row.shoot_date, photographer: row.photographer, items: [] });
          grouped.push(map.get(key));
        }
        map.get(key).items.push(row);
      }

      const currentDate = canonicalDate(dateSelect.value);
      result.innerHTML = displayNames.map(name => {
        const personRows = rows.filter(r => samePhotographer(r.photographer, name));
        const personDateRows = currentDate ? personRows.filter(r => sameDate(r.shoot_date, currentDate)) : personRows;
        if (!personDateRows.length) {
          const dateRowsCount = currentDate ? rows.filter(r => sameDate(r.shoot_date, currentDate)).length : rows.length;
          return `
            <article class="card">
              <div class="card-head">
                <div class="name">${esc(name)}</div>
              </div>
              <div class="meta">当日暂无样品</div>
              <div class="meta">诊断：当前日期共读取 ${dateRowsCount} 条；${esc(name)} 匹配 0 条</div>
              <div class="empty-inline">当日暂无样品</div>
            </article>
          `;
        }
        const groupedByDate = new Map();
        for (const row of personDateRows) {
          const dateKey = row.shoot_date || "未填写日期";
          if (!groupedByDate.has(dateKey)) groupedByDate.set(dateKey, []);
          groupedByDate.get(dateKey).push(row);
        }
        return [...groupedByDate.entries()].map(([shootDate, items]) => {
          const skuGroups = buildSkuGroups(items);
          const skus = skuGroups.flatMap(sub => sub.skus);
          const status = items[0]?.status || "";
          const remark = items[0]?.remark || "";
          const skuCopyKey = `sku-${copyIndex++}`;
          const messageCopyKey = `msg-${copyIndex++}`;
          copyStore[skuCopyKey] = skus.join("\n");
          copyStore[messageCopyKey] = buildCompleteMessage({ shoot_date: shootDate, photographer: name }, skuGroups);
          return `
            <article class="card">
              <div class="card-head">
                <div class="name">${esc(name)}</div>
                <div class="tools">
                  <button type="button" data-copy-key="${esc(skuCopyKey)}">复制 SKU</button>
                  <button type="button" data-copy-key="${esc(messageCopyKey)}">复制完整消息</button>
                </div>
              </div>
              <div class="meta">${esc(shootDate)}　${esc(status)}　${esc(remark)}　总数：${skus.length}</div>
              <div class="sample-groups">
                ${skuGroups.length ? skuGroups.map(sub => `
                  <div class="sample-group">
                    <div class="sample-head">
                      <span class="sample-title">${esc(sub.prefix)} 样品组</span>
                      <span class="sample-count">${sub.skus.length} 个SKU</span>
                    </div>
                    <div class="skus">${sub.skus.length ? sub.skus.map(s => `<span class="sku">${esc(s)}</span>`).join("") : '<span class="empty-inline">暂无 SKU</span>'}</div>
                  </div>
                `).join("") : '<span class="empty-inline">当日暂无样品</span>'}
              </div>
            </article>
          `;
        }).join("");
      }).join("");
    }

    async function loadRows() {
      state.loading = true;
      const pageSize = 1000;
      const allData = [];
      for (let from = 0; ; from += pageSize) {
        const to = from + pageSize - 1;
        const { data, error } = await supabaseClient
          .from(CONFIG.table)
          .select("shoot_date, photographer, sku, status, remark, updated_at, created_at")
          .order("shoot_date", { ascending: true })
          .order("photographer", { ascending: true })
          .order("created_at", { ascending: true })
          .range(from, to);

        if (error) {
          state.loading = false;
          throw error;
        }
        const chunk = data || [];
        allData.push(...chunk);
        if (chunk.length < pageSize) break;
      }

      state.loading = false;
      state.rows = allData.map(row => ({
        ...row,
        shoot_date: canonicalDate(row.shoot_date),
        photographer: normalizePhotographer(row.photographer),
        sku: String(row.sku ?? "").trim(),
        status: String(row.status ?? "").trim(),
        remark: String(row.remark ?? "").trim()
      }));
      state.updatedAt = new Date().toLocaleString("zh-CN", { hour12: false });
      refreshYears();
      syncDefaultDatePath();
      refreshMonthsForYear();
      refreshDatesForYear();
      refreshNames();
      render();
    }

    function setupRealtime() {
      const channel = supabaseClient
        .channel("sku-records-realtime")
        .on("postgres_changes", {
          event: "*",
          schema: CONFIG.realtimeSchema,
          table: CONFIG.table
        }, () => {
          loadRows().catch(err => {
            result.innerHTML = `<div class="empty">刷新失败：${esc(err?.message || err)}</div>`;
          });
        })
        .subscribe();

      window.addEventListener("beforeunload", () => {
        supabaseClient.removeChannel(channel);
      });
    }

    yearSelect.addEventListener("change", () => {
      monthSelect.value = "";
      dateSelect.value = "";
      refreshMonthsForYear();
      refreshDatesForYear();
      refreshNames();
      render();
    });

    monthSelect.addEventListener("change", () => {
      dateSelect.value = "";
      refreshDatesForYear();
      refreshNames();
      render();
    });

    dateSelect.addEventListener("change", () => {
      refreshNames();
      render();
      recordView("date_change");
    });

    nameSelect.addEventListener("change", () => {
      render();
      recordView("name_change");
    });
    skuInput.addEventListener("input", render);
    copyCurrentSkuBtn.addEventListener("click", () => {
      const selectedName = nameSelect.value.trim();
      if (!selectedName) {
        showToast("请先选择摄影师");
        return;
      }
      copyText(currentSkuText());
    });
    result.addEventListener("click", event => {
      const button = event.target.closest("[data-copy-key]");
      if (!button) return;
      copyText(copyStore[button.dataset.copyKey] || "");
    });
    closeCopyModalBtn.addEventListener("click", closeCopyModal);
    doneCopyModalBtn.addEventListener("click", closeCopyModal);
    selectCopyTextBtn.addEventListener("click", selectFallbackText);
    copyModal.addEventListener("click", event => {
      if (event.target === copyModal) closeCopyModal();
    });

    loadRows()
      .then(() => {
        setupRealtime();
        recordView("open");
      })
      .catch(err => {
        result.innerHTML = `<div class="empty">加载失败：${esc(err?.message || err)}</div>`;
      });
  </script>
</body>
</html>
